# 中文注释：SASS-AKCMamba-YOLO 可行性验证配置。
# 核心策略：P3 只保留 AKConv 局部细节，P4 使用空间下采样的稀疏扫描，P5 使用原始全局四方向扫描。

nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C3AKC, [128, True]] # 2-P2 local only
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C3SASSAKCMamba, [256, True, 1.0, 3, "none", 2, 8]] # 4-P3: no SSM scan
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C3SASSAKCMamba, [512, True, 1.0, 3, "atrous", 2, 8]] # 6-P4: sparse scan
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C3SASSAKCMamba, [1024, True, 1.0, 3, "full", 2, 8]] # 8-P5: global scan
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C4SASSAKCMamba, [512, True, 1.0, 3, "atrous", 2, 8]] # 12-P4 fusion: sparse scan

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C4SASSAKCMamba, [256, True, 1.0, 3, "none", 2, 8]] # 15-P3 small: local only

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C4SASSAKCMamba, [512, True, 1.0, 3, "atrous", 2, 8]] # 18-P4 medium: sparse scan

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C4SASSAKCMamba, [1024, True, 1.0, 3, "full", 2, 8]] # 21-P5 large: global scan

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)

